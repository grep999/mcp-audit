name: mcp-audit

description: >
  Audit the MCP servers in this repo against the NSA May-2026 MCP threat
  taxonomy and a known-CVE registry. Fails the build on critical/high
  findings. Uses the mcp-audit service for live rules when reachable;
  otherwise falls back to the bundled baseline ruleset.

inputs:
  path:
    description: Directory tree to audit (relative to repo root).
    required: false
    default: .
  feed-url:
    description: mcp-audit service endpoint for live rules (empty = bundled baseline).
    required: false
    default: ""
  fail-on:
    description: Severity threshold that fails the build (critical, high, or review).
    required: false
    default: high
  version:
    description: Git ref (tag/branch) of mcp-audit to install. Defaults to latest tagged release.
    required: false
    default: v0.1.0
  commit-state:
    description: Write .mcp-audit-state.json for rug-pull detection across runs.
    required: false
    default: "false"

outputs:
  verdict:
    description: pass / review / fail
  findings:
    description: total findings count
  report-path:
    description: path to the JSON report artifact

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install mcp-audit
      shell: bash
      run: |
        pip install git+https://github.com/grep999/mcp-audit@${{ inputs.version }}

    # Scan step ALWAYS succeeds: it produces the report and sets outputs, so the
    # caller can read verdict/findings even when the gate below fails.
    - name: Run mcp-audit
      id: audit
      shell: bash
      run: |
        set -euo pipefail
        FLAGS=(--format json)
        [[ -n "${{ inputs.feed-url }}" ]] && FLAGS+=(--feed "${{ inputs.feed-url }}")
        [[ "${{ inputs.commit-state }}" == "true" ]] && FLAGS+=(--commit-state)
        report_dir="${RUNNER_TEMP:-/tmp}/mcp-audit"
        mkdir -p "$report_dir"
        mcp-audit scan "${{ inputs.path }}" "${FLAGS[@]}" > "$report_dir/report.json" 2>&1 || true
        verdict=$(python3 -c "import json;print(json.load(open('$report_dir/report.json'))['summary']['verdict'])")
        findings=$(python3 -c "import json;print(json.load(open('$report_dir/report.json'))['summary']['total_findings'])")
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        echo "findings=$findings" >> "$GITHUB_OUTPUT"
        echo "report-path=$report_dir/report.json" >> "$GITHUB_OUTPUT"
        echo "Verdict: $verdict ($findings findings)"
        # Emit GH annotations
        python3 -c "import json;r=json.load(open('$report_dir/report.json'));[print('::%s file=.mcp.json,title=mcp-audit::[%s] %s: %s'%('error' if f['severity'] in ('critical','high') else 'warning',f.get('category'),f.get('server'),f.get('message'))) for f in r.get('findings',[]) if f.get('severity') in ('critical','high','medium')]" || true

    # Separate gate step: this is the only thing that exits non-zero, so the
    # action's declared outputs are already published by the time it runs.
    - name: Enforce gate
      shell: bash
      run: |
        set -euo pipefail
        verdict="${{ steps.audit.outputs.verdict }}"
        case "${{ inputs.fail-on }}" in
          critical) [[ "$verdict" == "review" || "$verdict" == "pass" ]] && exit 0 ;;
          high)     [[ "$verdict" == "pass" ]] && exit 0 ;;
          review)   exit 0 ;;
        esac
        echo "::error title=mcp-audit::Audit verdict '$verdict' meets fail-on threshold '${{ inputs.fail-on }}'"
        exit 1

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mcp-audit-report
        path: ${{ runner.temp }}/mcp-audit/report.json