[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-audit"
version = "0.1.0"
description = "Audit MCP servers before an AI agent trusts them. NSA May-2026 taxonomy, known-CVE registry, rug-pull detection."
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
mcp-audit = "cli.main:main"

[tool.setuptools.packages.find]
include = ["api*", "cli*"]