# Self-test: run the PUBLIC action (grep999/mcp-audit/action@v0.1.0) against
# this repo's known-CVE fixture. The action MUST fail the step (that is the
# gate working); we invert it with continue-on-error so the workflow itself is
# green while asserting the gate fired.
name: mcp-audit action self-test

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Expected to FAIL (exit 1) because the fixture has a critical CVE.
      - name: Run published mcp-audit action (expected to gate)
        id: audit
        continue-on-error: true
        uses: grep999/mcp-audit/action@v0.1.0
        with:
          path: tests/fixtures/bad
          fail-on: high

      - name: Assert the gate fired
        shell: bash
        run: |
          set -euo pipefail
          verdict="${{ steps.audit.outputs.verdict }}"
          findings="${{ steps.audit.outputs.findings }}"
          echo "verdict=$verdict findings=$findings"
          test "$verdict" = "fail" || { echo "FAIL: expected verdict=fail, got $verdict"; exit 1; }
          test "${{ steps.audit.outcome }}" = "failure" || { echo "FAIL: action did not gate"; exit 1; }
          echo "OK: published action gated a known-CVE fixture (verdict=$verdict, $findings findings)"